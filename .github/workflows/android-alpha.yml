name: Android Alpha

on:
  push:
    branches: [android-alpha]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Reject proprietary game data
        shell: bash
        run: |
          set -euo pipefail
          bad="$(find android -type f \( -iname '*.dat' -o -iname '*.rom' -o -iname '*.sav' -o -iname '*.dll' -o -iname '*.sis' -o -iname '*.app' \) -print 2>/dev/null || true)"
          if [ -n "$bad" ]; then
            echo "Proprietary/game-like files are not allowed in the Android alpha tree:"
            echo "$bad"
            exit 1
          fi

      - name: Prepare Unicorn Android arm64
        working-directory: android
        run: bash native/prepare_unicorn_android_arm64.sh

      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload alpha APK
        uses: actions/upload-artifact@v4
        with:
          name: ngage-sims-v0.1.0-alpha-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
